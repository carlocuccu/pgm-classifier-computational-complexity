name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the reproduction environment needs; 3.12 is where
        # the engineering is developed. The project claims both, so both run.
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each job installs a different set of packages from the same lockfile, so
      # each needs its own cache key. Without the suffix all three derive the
      # same one, race to upload it, and two of them log a failure to save.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python }}

      - name: Set up Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}

      # PyTorch is an extra, so this job stays small and fast; the estimators
      # get their own job below.
      - name: Install dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python }}

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      # Exercises the whole measurement pipeline with numpy stand-ins: the
      # split, the timing, the memory accounting and the thresholds, without
      # spending CI minutes on a real benchmark.
      - name: Harness self-test
        run: uv run pgm bench selftest

  estimators:
    name: estimators (PyTorch)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: estimators

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies, PyTorch included
        run: uv sync --locked --group dev --extra estimators

      # The equivalence of the k-PGM and the Rc-PGM, the bound on the retained
      # rank, and the observation that it exceeds d -- which is what settles
      # r_{G^c} as the rank of G^c rather than of G.
      - name: Test the published estimators
        run: uv run --extra estimators pytest -m torch
