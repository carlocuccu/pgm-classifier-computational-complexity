name: Datasets

# The data is not carried in this repository: it is rebuilt from PMLB, OpenML
# and UCI, byte for byte, by scripts/fetch_datasets.py. That guarantee depends
# on sources this project does not control, so it is checked on a schedule
# rather than discovered by a reader months later. A red run here means an
# upstream release moved, a URL changed, or a mirror went away -- and the
# digests say exactly which of the twelve files is affected.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  pull_request:
    paths:
      - "scripts/fetch_datasets.py"
      - "tests/test_dataset_specs.py"
      - ".github/workflows/datasets.yml"
  workflow_dispatch:

jobs:
  rebuild:
    name: rebuild from the public sources
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: datasets

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Download and rebuild every dataset
        run: uv run python scripts/fetch_datasets.py

      - name: Verify the digests offline
        run: uv run python scripts/fetch_datasets.py --check

      - name: Check the specifications against the sources
        run: uv run pytest -m network tests/test_dataset_specs.py

      - name: Check the tabulated training sizes come out of the split
        run: uv run pytest tests/test_harness.py
